At Excelsior Apex, our classrooms operate on the 'Question First' methodology. Before teaching Newton's laws, students construct catapults and measure trajectories. When theory answers questions that curiosity already asked, learning becomes permanent and deeply exhilarating.`},{id:2,title:"Cultivating Emotional Resilience: The Science Behind Student Mental Wellbeing",category:"Student Wellness",author:"Sunita Adhikari",authorRole:"Counseling & Wellbeing Head",date:"July 28, 2025",readTime:"5 min read",image:"https://images.pexels.com/photos/9489917/pexels-photo-9489917.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=500&w=800",excerpt:"Strategies for families and educators to navigate board exam anxiety and build unshakeable self-esteem in young adolescents.",content:`High expectations must always be matched with unconditional psychological safety. When students fear failure, their prefrontal cortex downregulates analytical processing.
